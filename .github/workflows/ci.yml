name: CI
on:
  push:
    branches: [ main ]
  # Deliberately NOT filtered to main. Filtering it meant no job ran on a pull request into
  # any other base, so a stacked branch could carry unformatted sources and uncompiled tests
  # all the way to the merge into main, where the gate would then fail on content nobody in
  # that pull request had touched.
  pull_request:
jobs:
  style-check:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v2
    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format
    - name: Run formatter
      run: |
        find . -name '*.h' -or -name '*.hpp' -or -name '*.cpp' | xargs clang-format -i --style=file:./util/workspace/.clang-format
        git diff --exit-code
  build:
    needs: style-check
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v2
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-
    - name: Build Docker image
      uses: docker/build-push-action@v2
      with:
        context: ./util/workspace
        file: ./util/workspace/Dockerfile
        push: false
        load: true
        tags: ros_workspace:latest
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache
    - name: Build ROS package
      run: |
        cd util/workspace
        docker compose run --rm rosbuild
    # catkin_make's default target is `all`, and catkin_add_gtest marks its targets
    # EXCLUDE_FROM_ALL, so the step above never compiles a single line of test code. Without
    # this step a syntax error in a test file is a green build.
    #
    # catkin_test_results is not optional. `catkin_make run_tests_scbdriver` writes the gtest
    # XML and exits 0 even when assertions failed, so on its own it would run the tests
    # without ever detecting a red one -- a quieter version of the same hole.
    - name: Run unit tests
      run: |
        cd util/workspace
        docker compose run --rm rosbuild bash -c \
          "source /opt/ros/noetic/setup.bash && catkin_make run_tests_scbdriver && catkin_test_results build/test_results --verbose"
